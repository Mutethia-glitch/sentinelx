name: SentinelX Task 41 regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Source syntax and core regression tests
        run: npm run quality
      - name: Task 41 deployment contracts
        run: npm run verify:deployment
  tenant_database:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelx_task41_ci
          POSTGRES_USER: sentinelx_ci
          POSTGRES_PASSWORD: disposable-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx_ci -d sentinelx_task41_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SENTINELX_TEST_DATABASE: '1'
      DATABASE_URL: postgresql://sentinelx_ci:disposable-only-ci-password@127.0.0.1:5432/sentinelx_task41_ci
      PGPASSWORD: disposable-only-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies and PostgreSQL client
        run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Isolated PostgreSQL RBAC and last-Administrator invariants
        run: node --test tests/integration/access.test.js
      - name: Isolated tenant 2FA invitation activation and disablement
        run: node --test tests/integration/tenant-authentication.test.js
      - name: Isolated website registration, role boundaries, server evidence and revocation
        run: node --test tests/integration/website-connectors.test.js
      - name: Create second isolated tenant test database
        run: psql -h 127.0.0.1 -U sentinelx_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sentinelx_other_task41_ci'
      - name: Real cross-company database, role and 2FA isolation
        env:
          SECOND_TENANT_DATABASE_URL: postgresql://sentinelx_ci:disposable-only-ci-password@127.0.0.1:5432/sentinelx_other_task41_ci
        run: node --test tests/integration/two-tenant-database.test.js
      - name: Create independent onboarding test database
        run: psql -h 127.0.0.1 -U sentinelx_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sentinelx_platform_task41_ci'
      - name: Independent platform registration and credential erasure
        env:
          DATABASE_URL: postgresql://sentinelx_ci:disposable-only-ci-password@127.0.0.1:5432/sentinelx_platform_task41_ci
        run: node --test tests/integration/platform-signup.test.js
      - name: Create isolated migration compatibility databases
        run: |
          psql -h 127.0.0.1 -U sentinelx_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sentinelx_migration_compat_tenant_ci'
          psql -h 127.0.0.1 -U sentinelx_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sentinelx_migration_compat_platform_ci'
      - name: Verify LF and CRLF historical migration ledgers against PostgreSQL
        env:
          MIGRATION_COMPAT_TENANT_DATABASE_URL: postgresql://sentinelx_ci:disposable-only-ci-password@127.0.0.1:5432/sentinelx_migration_compat_tenant_ci
          MIGRATION_COMPAT_PLATFORM_DATABASE_URL: postgresql://sentinelx_ci:disposable-only-ci-password@127.0.0.1:5432/sentinelx_migration_compat_platform_ci
        run: node --test tests/integration/migration-line-endings.test.js
