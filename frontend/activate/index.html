<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SentinelX · Activate account</title><link rel="stylesheet" href="/ui/sentinelx-theme.css"><script src="/ui/sentinelx-ui.js" defer></script><script src="/activate/activate.js" defer></script></head><body data-page="activate"><main class="sx-content sx-auth-centered"><section class="sx-auth-screen sx-auth-card"><div class="sx-auth-intro"><span class="sx-auth-intro-mark" data-icon="shield"></span><h1>Activate your company account</h1><p>Use the email address your company administrator invited, the six-digit activation code sent to that address, and a new password of at least 15 characters.</p></div><div class="sx-panel"><div class="sx-panel-head"><div><h2>Account activation</h2></div></div><form id="activate-form" class="sx-panel-body"><label>Email<input id="email" type="email" autocomplete="username" maxlength="254" required></label><label>6-digit code<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><label>New password<input id="password" type="password" autocomplete="new-password" minlength="15" required></label><button type="submit">Activate account</button><p id="message" role="status" aria-live="polite"></p><p class="hint"><a href="/access">Back to sign in</a></p></form></div></section></main></body></html>
