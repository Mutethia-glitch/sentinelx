services:
  onboarding:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node","src/platform/server.js"]
    restart: unless-stopped
    env_file:
      - ./platform.env
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
